<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#152f35" />
    <meta name="description" content="Move Toasty around a grid-based workshop and push crates with WASD." />
    <title>Toasty's Workshop</title>
  </head>
  <body>
    <main id="game" aria-label="Toasty's workshop">
      <div id="viewport"></div>
      <button id="reset" class="reset" type="button" aria-label="Reset workshop" title="Reset workshop">↺</button>
      <div class="controls"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>Move · Push crates</span></div>
      <div class="dpad" role="group" aria-label="Movement controls">
        <button type="button" data-direction="up" aria-label="Move forward">↑</button>
        <button type="button" data-direction="left" aria-label="Move left">←</button>
        <button type="button" data-direction="down" aria-label="Move backward">↓</button>
        <button type="button" data-direction="right" aria-label="Move right">→</button>
      </div>
      <p id="render-error" hidden>Your browser couldn’t start WebGL. Try enabling hardware acceleration.</p>
      <p id="status" class="sr-only" role="status"></p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
