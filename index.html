<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b9e4fa" />
    <meta name="description" content="Explore Toasty's flying aircraft with Miku and Makima. Visit the cockpit, living quarters, engineering, and mission bays." />
    <title>Toasty's Sky Cruiser</title>
  </head>
  <body>
    <main id="game" aria-label="Toasty's flying aircraft">
      <div id="viewport"></div>
      <p id="loading" role="status">Loading characters&hellip;</p>
      <aside id="encounter" aria-label="Nearby character" hidden>
        <div class="encounter-portrait"><canvas id="encounter-portrait" aria-hidden="true"></canvas></div>
        <p id="encounter-name" aria-live="polite"></p>
        <button id="talk" type="button"><kbd>E</kbd> Talk</button>
      </aside>
      <aside class="player-hud" aria-label="Toasty character stats">
        <div class="avatar" role="img" aria-label="Toasty's 3D model">
          <canvas id="toasty-portrait" aria-hidden="true"></canvas>
        </div>
          <dl class="player-stats">
            <div class="stat power" title="Mechanical power">
              <dt><span class="sr-only">Mechanical power</span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="m9.5 2-.7 2.5-1.4.8L5 4.6 2.6 8.8l1.8 1.8v1.7L2.6 14 5 18.3l2.4-.7 1.4.8.7 2.6h5l.7-2.6 1.4-.8 2.4.7 2.4-4.3-1.8-1.7v-1.7l1.8-1.8L19 4.6l-2.4.7-1.4-.8-.7-2.5h-5ZM12 7a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg></dt>
              <dd>80</dd>
            </div>
            <div class="stat intelligence" title="Intelligence">
              <dt><span class="sr-only">Intelligence</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3.3C8.8 1.3 5.5 2.6 5 5a4 4 0 0 0-2.7 6.4 4.3 4.3 0 0 0 .8 7.1c.2 2.8 4.2 4.5 7.9 2V3.3Zm2 0C15.2 1.3 18.5 2.6 19 5a4 4 0 0 1 2.7 6.4 4.3 4.3 0 0 1-.8 7.1c-.2 2.8-4.2 4.5-7.9 2V3.3Z"/></svg></dt>
              <dd>65</dd>
            </div>
            <div class="stat resources" title="Storage size">
              <dt><span class="sr-only">Storage size</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 4.2-9 4.2-9-4.2L12 2ZM2 7.9l9 4.2v9.5l-9-4.3V7.9Zm20 0v9.4l-9 4.3v-9.5l9-4.2Z"/></svg></dt>
              <dd>24</dd>
            </div>
          </dl>
      </aside>
      <div class="dpad" role="group" aria-label="Movement controls">
        <button type="button" data-direction="up" aria-label="Move forward">&#8593;</button>
        <button type="button" data-direction="left" aria-label="Move left">&#8592;</button>
        <button type="button" data-direction="down" aria-label="Move backward">&#8595;</button>
        <button type="button" data-direction="right" aria-label="Move right">&#8594;</button>
      </div>
      <p id="render-error" hidden>Your browser could not start WebGL. Try enabling hardware acceleration.</p>
      <p id="status" class="sr-only" role="status"></p>
      <p id="mission-feedback" role="status" hidden></p>
      <dialog id="conversation" aria-labelledby="conversation-name" aria-describedby="conversation-line">
        <header><h2 id="conversation-name"></h2><button id="conversation-close" type="button" aria-label="Close conversation">&#215;</button></header>
        <p id="conversation-line" aria-live="polite"></p>
        <div id="conversation-choices"></div>
      </dialog>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
